name: 測試

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python 測試（命令列工具）
        run: python -m unittest discover -s tests -v
      - name: JavaScript 測試（手機 App）
        run: npm test
